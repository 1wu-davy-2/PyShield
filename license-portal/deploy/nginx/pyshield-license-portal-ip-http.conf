# PyShield license portal - no-domain HTTP reverse proxy.
#
# Public port 80 -> loopback portal on 127.0.0.1:8192.
# This hides the portal port, not the server's public IP.  If the origin IP
# must be hidden, put a CDN or tunnel in front of this server.
#
# The portal must be configured with:
#   PYSHELD_PORTAL_HTTP_PORT=8192
#   PYSHELD_PORTAL_BIND_ADDR=127.0.0.1
#   PYSHELD_PORTAL_SITE_URL=http://YOUR_PUBLIC_IP
#   PYSHELD_PORTAL_TRUST_PROXY=true
#   PYSHELD_PORTAL_SECURE_COOKIES=false
#
# Inside the container the service always listens on 0.0.0.0:8091 (set in
# compose.yaml).  HTTP_PORT/BIND_ADDR only control the host-side publish:
# keep 127.0.0.1 here so only Nginx can reach it.  For direct access without
# Nginx use BIND_ADDR=0.0.0.0, TRUST_PROXY=false and open the host port.
#
# This is plain HTTP.  Passwords and session cookies are not encrypted in
# transit; use it only for a private test or behind an external TLS tunnel.
# On CentOS, disable any existing conf.d/default.conf that also listens on 80.

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/pyshield-license-portal.access.log;
    error_log  /var/log/nginx/pyshield-license-portal.error.log;

    location / {
        proxy_pass http://127.0.0.1:8192;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: trust_proxy consumes this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; base-uri 'none'; form-action 'self'" always;
        # Do not add HSTS here: this server only speaks HTTP.
    }

    location = /health {
        proxy_pass http://127.0.0.1:8192;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8192;
        proxy_set_header Host $host;
        access_log off;
    }

    # Optional: restrict the admin API to known source addresses.
    # Do not enable this if your own public IP changes frequently.
    #
    # location ^~ /api/admin/ {
    #     allow 203.0.113.10;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8192;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $remote_addr;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
