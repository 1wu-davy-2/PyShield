# PyShield license portal - Nginx in front of the Docker container.
#
# The compose stack binds the portal to 127.0.0.1:8091. This server block
# terminates TLS and proxies both the SPA and the API to that loopback port.
# The container serves web/dist itself, so no static root is needed here.
#
# Replace license.example.com and the certificate paths before enabling.
#
# Install (Debian/Ubuntu):
#   sudo cp pyshield-license-portal-docker.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/pyshield-license-portal-docker.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name license.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name license.example.com;

    ssl_certificate     /etc/letsencrypt/live/license.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/license.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/pyshield-license-portal.access.log;
    error_log  /var/log/nginx/pyshield-license-portal.error.log;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # trust_proxy=true in compose consumes this value; do not expose 8091
        # directly to the internet or clients can spoof the header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; base-uri 'none'; form-action 'self'" always;
        # Cache-Control is emitted by the Python static handler: assets are
        # fingerprint-cached, index.html and admin routes are no-store.
    }

    location = /health {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        access_log off;
    }

    # Optional network-edge restriction for the admin API, in addition to
    # PYSHELD_PORTAL_ADMIN_ALLOW_IPS:
    #
    # location ^~ /api/admin/ {
    #     allow 203.0.113.10;
    #     allow 10.8.0.0/24;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8091;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $remote_addr;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
