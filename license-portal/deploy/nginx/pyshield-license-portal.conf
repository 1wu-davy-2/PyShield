# PyShield License Portal - Nginx (React SPA + API reverse proxy)
#
# Install as /etc/nginx/conf.d/pyshield-license-portal.conf (RHEL/Fedora) or
# /etc/nginx/sites-available/pyshield-license-portal.conf with a symlink into
# sites-enabled/ (Debian/Ubuntu). Replace the domain, certificate paths and
# the static root.
#
# Layout on the server:
#   /opt/pyshield-portal/license-portal/web/dist   <- `npm run build` output
#   /var/lib/pyshield-portal                       <- PYSHELD_PORTAL_DATA_DIR
#   systemd unit: pyshield-license-portal.service  <- 127.0.0.1:8091

server {
    listen 80;
    listen [::]:80;
    server_name license.example.com;

    return 301 https://$host$request_uri;
}

server {
    # For nginx >= 1.25 prefer: listen 443 ssl; http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name license.example.com;

    # TLS placeholders. Use your own certificate or certbot paths.
    ssl_certificate     /etc/letsencrypt/live/license.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/license.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/pyshield-license-portal.access.log;
    error_log  /var/log/nginx/pyshield-license-portal.error.log;

    root /opt/pyshield-portal/license-portal/web/dist;

    # ---- static SPA -------------------------------------------------------
    #
    # The document response carries the security headers; the API emits its own
    # from Python. Keep these in sync with license_portal/security.py.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; base-uri 'none'; form-action 'self'" always;
        add_header Cache-Control "no-store" always;
    }

    # Vite fingerprints every asset name, so it is safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Never let the SPA shell be cached for the admin area.
    location ^~ /admin {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- API --------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        access_log off;
    }

    # Optional: restrict the admin console at the network edge in addition to
    # PYSHELD_PORTAL_ADMIN_ALLOW_IPS.
    #
    # location ^~ /api/admin/ {
    #     allow 203.0.113.10;
    #     allow 10.8.0.0/24;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8091;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $remote_addr;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
