name: native-runtime

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: native-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PYSHELD_DEV: "1"

jobs:
  native:
    name: Native runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython>=3" "setuptools>=68"

      - name: Install LLVM strip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command llvm-strip -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
          }
          if (Test-Path "C:\Program Files\LLVM\bin") {
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          Get-Command llvm-strip -ErrorAction SilentlyContinue | Format-List

      - name: Create demo project
        run: python tools/make_ci_demo.py ci-native-project

      - name: Build with --runtime-native
        run: >-
          python shield.py build
          -p ci-native-project
          -o dist-native
          --cipher chacha-pure
          --integrity protected
          --runtime-native
          --no-verify
          --force

      - name: Verify native layout
        run: python tools/check_native_build.py --phase layout dist-native

      - name: Verify no master key exposure
        run: python tools/check_native_build.py --phase keys dist-native

      - name: Check native imports
        working-directory: dist-native
        run: |
          python -c "import _shield_runtime; print('package import ok')"
          python -c "import _shield_runtime._core as core; print('core ok', core.BUILD_ID)"
          python -c "import _shield_runtime._crypto, _shield_runtime._ed25519, _shield_runtime._keyring, _shield_runtime._chacha_fast; print('extensions ok')"

      - name: Check keyring and decrypt path
        run: python tools/diagnose_native_runtime.py dist-native

      - name: Check protected license state
        working-directory: dist-native
        env:
          PYSHELD_STATE_DIR: ${{ github.workspace }}/native-state
        run: python -c "from _shield_runtime import license_status; print(license_status())"

      - name: Check direct load_module (package)
        env:
          PYSHELD_STATE_DIR: ${{ github.workspace }}/native-state
        run: python tools/diagnose_native_runtime.py --execute --target mypkg dist-native

      - name: Check direct load_module (module)
        env:
          PYSHELD_STATE_DIR: ${{ github.workspace }}/native-state
        run: python tools/diagnose_native_runtime.py --execute --target mypkg.tools dist-native

      - name: Check protected package init
        working-directory: dist-native
        env:
          PYSHELD_STATE_DIR: ${{ github.workspace }}/native-state
        run: python -c "import mypkg; print('package init ok')"

      - name: Check protected module load
        working-directory: dist-native
        env:
          PYSHELD_STATE_DIR: ${{ github.workspace }}/native-state
        run: python -c "from mypkg import tools; print('module load ok', tools.double(21))"

      - name: Run protected native app
        working-directory: dist-native
        env:
          PYSHELD_STATE_DIR: ${{ github.workspace }}/native-state
        run: python manage.py check

      - name: Verify native runtime
        working-directory: dist-native
        env:
          PYSHELD_STATE_DIR: ${{ github.workspace }}/native-state
        run: python -m _shield_runtime verify --json

      - name: Checksum native sample
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          Get-ChildItem dist-native -Recurse -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path)" } |
            Out-File -FilePath dist-native-SHA256SUMS.txt -Encoding utf8

      - name: Checksum native sample (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist-native
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../dist-native-SHA256SUMS.txt
          du -h ../dist-native-SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: native-runtime-${{ matrix.os }}
          path: |
            dist-native/
            dist-native-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
