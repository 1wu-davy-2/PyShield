name: build-develop

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: build-develop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  RELEASE_TAG: ci-develop-latest

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography

      - name: Run unit tests
        run: python tools/run_tests.py

  trial-flow:
    name: Trial registration flow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Walk the registration flow
        run: |
          set -euo pipefail
          python -m pyshield.license_admin init --out root-keys
          export PYSHELD_HOME="$RUNNER_TEMP/home"
          export PYSHELD_TOOL_PUBLIC_KEY="$(cat root-keys/root.pub)"
          mkdir -p "$PYSHELD_HOME"
          python -m pyshield.trial_server --root-key root-keys/root.key --data-dir trial-data --port 8090 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          SERIAL=$(python -c "from pyshield import trial_license; print(trial_license.local_serial())")
          MACHINE=$(python -c "from pyshield import trial_license; print(trial_license.install_state()['machine'])")
          echo "serial=$SERIAL"
          curl -fsS -X POST -d "serial=$SERIAL&machine=$MACHINE&edition=trial" http://127.0.0.1:8090/trial/apply | grep -q "试用已开通"
          python -c "from pyshield import trial_license, tool_license; e = trial_license.claim_and_apply('http://127.0.0.1:8090'); s = tool_license.check(); print('license', e.license_id, e.edition, e.max_builds_per_month); print('mode', s.mode, 'quota', s.quota.get('limit')); assert s.valid and e.edition == 'trial' and s.quota.get('limit') == 3 and not s.allows('native-runtime')"
          python -c "import sqlite3; print('trials', sqlite3.connect('trial-data/trials.sqlite3').execute('select serial,status,expires,max_builds from trials').fetchall())"

  windows:
    name: Windows builder (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: test
    # Windows on ARM is best effort: pywebview needs a working .NET/WinForms
    # runtime on the runner, which GitHub only ships on the arm64 image.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            machine: "0x8664"
          - arch: x86
            runner: windows-latest
            machine: "0x014c"
          - arch: arm64
            runner: windows-11-arm
            machine: "0xaa64"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview==6.2.1 pythonnet==3.2.1 pyinstaller==6.22.3 'Cython>=3'
          # cryptography ships no win_arm64 wheel and dropped win32 in 45+:
          # pin the last version with a 32-bit wheel, and build arm64 from source.
          if ('${{ matrix.arch }}' -eq 'x86') {
            python -m pip install cryptography==44.0.3
          } elseif ('${{ matrix.arch }}' -eq 'arm64') {
            # No win_arm64 wheel upstream: compile against vcpkg's OpenSSL.
            vcpkg install openssl:arm64-windows
            $env:OPENSSL_DIR = "$env:VCPKG_INSTALLATION_ROOT\installed\arm64-windows"
            python -m pip install cryptography==44.0.3 --no-binary cryptography
          } else {
            python -m pip install cryptography
          }
          python -c "import cryptography; print('cryptography', cryptography.__version__)"

      - name: Build PyShieldBuilder.exe
        run: python -m PyInstaller --noconfirm --clean PyShieldBuilder.spec

      - name: Verify PE machine type
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, struct
          from pathlib import Path
          data = Path("dist/PyShieldBuilder.exe").read_bytes()[:1024]
          pe = struct.unpack_from("<I", data, 0x3C)[0]
          machine = struct.unpack_from("<H", data, pe + 4)[0]
          actual = f"0x{machine:04x}"
          print(f"PE machine={actual} expected={os.environ['EXPECTED_MACHINE']}")
          assert actual == os.environ["EXPECTED_MACHINE"], actual
          PY

      - name: Release hygiene scan
        run: python tools/check_release.py --skip-key-scan dist

      - name: MCP stdio smoke (single executable)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mcp-smoke/projects/demo"
          printf "print('ok')\n" > "$RUNNER_TEMP/mcp-smoke/projects/demo/manage.py"
          PYSHELD_DEV=1 dist/PyShieldBuilder.exe --mcp \
            --project-root "$RUNNER_TEMP/mcp-smoke/projects" \
            --output-root "$RUNNER_TEMP/mcp-smoke/out" \
            --state-dir "$RUNNER_TEMP/mcp-smoke/state" \
            --allow-build --selftest
          python tools/mcp_smoke.py --server dist/PyShieldBuilder.exe --arg=--mcp

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum PyShieldBuilder.exe > "SHA256SUMS-windows-${{ matrix.arch }}.txt"
          cat "SHA256SUMS-windows-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: PyShieldBuilder-windows-${{ matrix.arch }}
          path: |
            dist/PyShieldBuilder.exe
            dist/SHA256SUMS-windows-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux builder + packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Install GTK/WebKit and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-venv xvfb rpm libfuse2 \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-soup-3.0

      - name: Create build environment
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pywebview==6.2.1 pyinstaller==6.22.3 cryptography 'Cython>=3'

      - name: Verify GTK/WebKit bindings
        run: |
          .venv/bin/python - <<'PY'
          import gi
          gi.require_version("Gtk", "3.0")
          gi.require_version("WebKit2", "4.1")
          from gi.repository import Gtk, WebKit2
          print("GTK", Gtk.get_major_version(), Gtk.get_minor_version())
          print("WebKit2", WebKit2.get_major_version(), WebKit2.get_minor_version())
          PY

      - name: Build PyShieldBuilder
        run: .venv/bin/python -m PyInstaller --noconfirm --clean PyShieldBuilder.spec

      - name: Smoke test under Xvfb
        continue-on-error: true
        run: |
          set +e
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
          WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            xvfb-run -a timeout 25s ./dist/PyShieldBuilder > smoke.log 2>&1
          code=$?
          cat smoke.log
          if [ "$code" -ne 124 ]; then
            echo "GUI exited before the timeout (exit $code)"
            exit 1
          fi
          echo "GUI stayed up for 25s"

      - name: Package tar.gz / deb / rpm / AppImage
        env:
          PYTHON: .venv/bin/python
        run: bash scripts/package_linux.sh

      - name: Checksum
        run: |
          set -euo pipefail
          test -x dist/PyShieldBuilder
          file dist/PyShieldBuilder
          cd dist
          sha256sum PyShieldBuilder *.tar.gz *.deb *.rpm *.AppImage > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
          {
            echo "### Linux builder"
            echo ""
            for f in PyShieldBuilder *.tar.gz *.deb *.rpm *.AppImage; do
              echo "- \`$f\` ($(du -h "$f" | cut -f1))"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: MCP stdio smoke (single executable)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mcp-smoke/projects/demo"
          printf "print('ok')\n" > "$RUNNER_TEMP/mcp-smoke/projects/demo/manage.py"
          PYSHELD_DEV=1 ./dist/PyShieldBuilder --mcp \
            --project-root "$RUNNER_TEMP/mcp-smoke/projects" \
            --output-root "$RUNNER_TEMP/mcp-smoke/out" \
            --state-dir "$RUNNER_TEMP/mcp-smoke/state" \
            --allow-build --selftest
          .venv/bin/python tools/mcp_smoke.py --server dist/PyShieldBuilder --arg=--mcp

      - uses: actions/upload-artifact@v7
        with:
          name: PyShieldBuilder-linux-x64
          path: |
            dist/PyShieldBuilder
            dist/PyShieldBuilder-*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview==6.2.1 pyinstaller==6.22.3 cryptography 'Cython>=3'

      - name: Build PyShieldBuilder
        run: python -m PyInstaller --noconfirm --clean PyShieldBuilder.spec

      - name: MCP stdio smoke
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mcp-smoke/projects/demo"
          printf "print('ok')\n" > "$RUNNER_TEMP/mcp-smoke/projects/demo/manage.py"
          PYSHELD_DEV=1 ./dist/PyShieldBuilder --mcp \
            --project-root "$RUNNER_TEMP/mcp-smoke/projects" \
            --output-root "$RUNNER_TEMP/mcp-smoke/out" \
            --state-dir "$RUNNER_TEMP/mcp-smoke/state" \
            --allow-build --selftest
          python tools/mcp_smoke.py --server dist/PyShieldBuilder --arg=--mcp

      - name: Package .app / .dmg
        env:
          PYTHON: python
        run: bash scripts/package_macos.sh "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: PyShieldBuilder-macos-${{ matrix.arch }}
          path: |
            dist/PyShieldBuilder-*.dmg
            dist/PyShieldBuilder-*.zip
            dist/SHA256SUMS-macos-*.txt
          if-no-files-found: error
          retention-days: 30


  selfcheck:
    name: Protected Django demo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    env:
      # The builder requires an activated tool license; this job only checks
      # that the protection engine still produces a working package.
      PYSHELD_DEV: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Django
        run: |
          python -m pip install --upgrade pip
          python -m pip install django
          python -c "import django; print('django', django.get_version())"

      - name: Crypto selftest
        run: python shield.py selftest

      - name: Create demo project
        run: django-admin startproject demo

      - name: Protect the demo project
        run: python shield.py build -p demo -o dist-demo --cipher chacha-pure

      - name: Verify the protected output
        run: |
          cd dist-demo
          python -m _shield_runtime verify
          python -m _shield_runtime status --json
          python manage.py check
          cd ..

      - name: Release hygiene scan
        run: python tools/check_release.py dist-demo

      - name: Show what changed
        run: |
          echo "--- protected stub (manage.py) ---"
          head -n 12 dist-demo/manage.py
          echo "--- plaintext leak check ---"
          if grep -rq "SECRET_KEY" dist-demo --include=*.py; then
            echo "plaintext settings found"; exit 1
          fi
          echo "no plaintext settings"
          echo "--- output tree ---"
          find dist-demo -maxdepth 2 -type f | sort | head -40
          echo "--- sizes ---"
          du -sh dist-demo dist-demo/_shield_runtime

      - uses: actions/upload-artifact@v7
        with:
          name: protected-demo
          path: dist-demo
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish CI snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [windows, linux, macos, selfcheck]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/PyShieldBuilder-windows-x64/PyShieldBuilder.exe release/PyShieldBuilder-windows-x64.exe
          cp artifacts/PyShieldBuilder-windows-x86/PyShieldBuilder.exe release/PyShieldBuilder-windows-x86.exe || true
          cp artifacts/PyShieldBuilder-windows-arm64/PyShieldBuilder.exe release/PyShieldBuilder-windows-arm64.exe || true
          cp artifacts/PyShieldBuilder-linux-x64/PyShieldBuilder release/PyShieldBuilder-linux-x64
          cp artifacts/PyShieldBuilder-linux-x64/*.tar.gz release/ || true
          cp artifacts/PyShieldBuilder-linux-x64/*.deb release/ || true
          cp artifacts/PyShieldBuilder-linux-x64/*.rpm release/ || true
          cp artifacts/PyShieldBuilder-linux-x64/*.AppImage release/ || true
          cp artifacts/PyShieldBuilder-macos-*/*.dmg release/ || true
          cp artifacts/PyShieldBuilder-macos-*/*.zip release/ || true
          cp artifacts/PyShieldBuilder-*/SHA256SUMS-*.txt release/ || true
          if [ -d artifacts/protected-demo ]; then
            python -c "import shutil; shutil.make_archive('release/protected-demo', 'zip', 'artifacts/protected-demo')"
          fi
          cd release
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "repository: $GITHUB_REPOSITORY"
          echo "tag: $RELEASE_TAG"
          gh auth status
          NOTES="自动构建快照，每次推送到 develop 都会覆盖这些资产，不是正式发布版本。"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "CI snapshot · develop" \
              --notes "$NOTES"
          fi
          # Older snapshots used different asset names; drop them so the
          # release only lists the current matrix.
          for stale in PyShieldBuilder PyShieldBuilder.exe PyShieldMCP.exe PyShieldMCP SHA256SUMS-mcp.txt; do
            gh release delete-asset "$RELEASE_TAG" "$stale" --yes \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          done
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size) bytes"'
